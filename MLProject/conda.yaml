# Runtime environment for the credit-scoring MLflow Project.
#
# The same pins serve both execution paths, so they must stay in sync:
#   mlflow run MLProject                      -> conda builds this environment
#   mlflow run MLProject --env-manager=local  -> CI pip-installs the pip: block
#
# Pinning rules
#   - python and mlflow are fixed by the Dicoding guide (3.12.7, 2.19.0).
#   - scikit-learn must stay inside MLflow 2.19.0's certified range for
#     autologging and the sklearn model flavor: 0.24.1 <= scikit-learn <= 1.5.2.
#   - scipy and cloudpickle are pinned because MLflow copies them into the
#     logged model's requirements.txt; left floating, the serving environment
#     would depend on the day training ran.
name: credit-scoring-ci
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.7
  - pip
  - pip:
      - cloudpickle==3.1.0
      - matplotlib==3.9.2
      - mlflow==2.19.0
      - numpy==2.1.3
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - scipy==1.14.1
