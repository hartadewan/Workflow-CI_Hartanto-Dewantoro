name: CI - Train and publish credit scoring model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PROJECT_DIR: MLProject
  DATA_DIR: MLProject/namadataset_preprocessing
  EXPERIMENT_NAME: Credit Scoring - CI
  IMAGE_NAME: credit-scoring-model
  SERVING_PORT: "5005"

jobs:
  train-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MLflow and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            cloudpickle==3.1.0 \
            matplotlib==3.9.2 \
            mlflow==2.19.0 \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            scipy==1.14.1

      - name: Validate prepared dataset
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          data_dir = Path(os.environ["DATA_DIR"])
          for split in ("train", "test"):
              path = data_dir / f"{split}.csv"
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Dataset missing or empty: {path}")
              with path.open(newline="", encoding="utf-8-sig") as handle:
                  reader = csv.reader(handle)
                  header = next(reader, [])
              if "credit_risk" not in header:
                  raise SystemExit(
                      f"Target column credit_risk not found in {path}. "
                      f"Columns: {header}"
                  )
              print(f"Validated {path} ({path.stat().st_size} bytes)")
          PY

      - name: Train with MLflow Project
        env:
          MLFLOW_TRACKING_URI: file://${{ runner.temp }}/mlruns
          MLFLOW_EXPERIMENT_NAME: ${{ env.EXPERIMENT_NAME }}
        run: |
          mlflow run "${PROJECT_DIR}" --env-manager local \
            --experiment-name "${EXPERIMENT_NAME}" \
            --run-name "ci-${GITHUB_RUN_ID}"

      - name: Resolve trained MLflow model
        id: model
        env:
          MLFLOW_TRACKING_URI: file://${{ runner.temp }}/mlruns
          MLFLOW_EXPERIMENT_NAME: ${{ env.EXPERIMENT_NAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import mlflow

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          runs = mlflow.search_runs(
              experiment_names=[os.environ["MLFLOW_EXPERIMENT_NAME"]],
              filter_string="attributes.status = 'FINISHED'",
              order_by=["attributes.start_time DESC"],
          )
          if runs.empty:
              raise SystemExit("No finished MLflow run was found.")
          run_id = runs.iloc[0]["run_id"]
          model_uri = f"runs:/{run_id}/model"
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              f"run_id={run_id}\nmodel_uri={model_uri}\n", encoding="utf-8"
          )
          print(f"Using {model_uri}")
          PY

      - name: Verify logged model and package artifact
        env:
          MLFLOW_TRACKING_URI: file://${{ runner.temp }}/mlruns
          MODEL_URI: ${{ steps.model.outputs.model_uri }}
          RUN_ID: ${{ steps.model.outputs.run_id }}
        run: |
          mkdir -p release
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import mlflow
          import pandas as pd

          data = pd.read_csv("MLProject/namadataset_preprocessing/test.csv")
          target = data.pop("credit_risk")
          model = mlflow.pyfunc.load_model(os.environ["MODEL_URI"])
          predictions = model.predict(data)
          accuracy = float((predictions == target).mean())
          if accuracy < 0.50:
              raise SystemExit(f"Unexpectedly low hold-out accuracy: {accuracy:.4f}")
          Path("release/verification.json").write_text(
              json.dumps({"run_id": os.environ["RUN_ID"], "accuracy": accuracy}, indent=2),
              encoding="utf-8",
          )
          PY
          mlflow artifacts download --run-id "${RUN_ID}" --artifact-path model \
            --dst-path release
          test -f release/model/MLmodel
          python - <<'PY'
          import os
          import mlflow
          import pandas as pd

          data = pd.read_csv("MLProject/namadataset_preprocessing/test.csv")
          target = data.pop("credit_risk")
          packaged_model = mlflow.pyfunc.load_model("release/model")
          predictions = packaged_model.predict(data)
          if len(predictions) != len(target):
              raise SystemExit("Packaged model returned an invalid prediction count.")
          PY
          tar -C release -czf release/model.tar.gz model
          sha256sum release/model.tar.gz > release/SHA256SUMS

      - name: Upload model artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: credit-scoring-model-${{ github.sha }}
          path: release/
          retention-days: 30

      - name: Build serving image with MLflow
        env:
          MLFLOW_TRACKING_URI: file://${{ runner.temp }}/mlruns
          MODEL_URI: ${{ steps.model.outputs.model_uri }}
        run: |
          mlflow models build-docker \
            --model-uri "${MODEL_URI}" \
            --name "${IMAGE_NAME}:${GITHUB_SHA}" \
            --env-manager local

      - name: Smoke test serving image
        run: |
          container="$(docker run -d -p "127.0.0.1:${SERVING_PORT}:8080" \
            "${IMAGE_NAME}:${GITHUB_SHA}")"
          cleanup() {
            docker logs "${container}" || true
            docker rm -f "${container}" || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --silent --fail "http://127.0.0.1:${SERVING_PORT}/ping" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail "http://127.0.0.1:${SERVING_PORT}/ping"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repository="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${repository}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${repository}:latest"
          docker push "${repository}:${GITHUB_SHA}"
          docker push "${repository}:latest"
          digest="$(docker buildx imagetools inspect "${repository}:${GITHUB_SHA}" \
            --format '{{json .Manifest}}' | python -c \
            'import json,sys; print(json.load(sys.stdin)["digest"])')"
          {
            echo "### Model published"
            echo "- MLflow run: \`${{ steps.model.outputs.run_id }}\`"
            echo "- Docker image: \`${repository}:${GITHUB_SHA}\`"
            echo "- Docker digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
